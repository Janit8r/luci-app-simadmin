name: build-aarch64

# 目标：产出可直接放进 luci-app-simadmin/root/opt/simadmin/ 的 aarch64-musl 二进制。
# 本机（Windows）没有 aarch64-linux-musl 交叉编译器，ring / rusqlite 的 C 部分编不过，
# 所以交叉编译放在 Linux runner 上做。
#
# 工具链走 cross（ghcr.io 上的官方 musl 镜像）而不是 musl.cc 预编译包：
# musl.cc 经常连不上，且镜像里是真正的 aarch64-linux-musl-gcc，ring 的汇编能正常编。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-musl
  CROSS_VERSION: v0.2.5

jobs:
  # 先跑纯逻辑单测（SIP 报文、RPDU/TPDU 编解码、EF_SMSC 解析、去重落库…），
  # 交叉编译一旦挂在这里就能第一时间定位是代码问题还是工具链问题。
  test:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SimAdmin-main/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('SimAdmin-main/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run volte tests
        working-directory: SimAdmin-main
        run: cargo test --locked volte -- --test-threads=1

  build:
    name: Build aarch64-musl
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        run: |
          set -euo pipefail
          url="https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o /tmp/cross.tgz "$url"
          mkdir -p /tmp/cross-bin
          tar -xzf /tmp/cross.tgz -C /tmp/cross-bin
          # release 包里可能是裸二进制也可能带目录前缀，统一 find 出来再装
          bin="$(find /tmp/cross-bin -type f -name cross -perm -u+x | head -n1)"
          test -n "$bin"
          sudo install -m 0755 "$bin" /usr/local/bin/cross
          cross --version

      # 先把镜像拉下来：镜像拉取失败会在这里直接报错，
      # 而不是等到 cargo 编译到一半才暴露成难读的容器错误。
      - name: Pull cross image
        run: docker pull "ghcr.io/cross-rs/${TARGET}:${CROSS_VERSION#v}"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SimAdmin-main/target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('SimAdmin-main/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-musl-

      - name: Build simadmin
        working-directory: SimAdmin-main
        run: cross build --release --locked --target "$TARGET" -p simadmin

      - name: Stage binary into LuCI package
        run: |
          set -euo pipefail
          # cross 以 root 在容器里写 target/，先交还属主再拷贝
          sudo chown -R "$(id -u):$(id -g)" "SimAdmin-main/target"
          mkdir -p out
          cp "SimAdmin-main/target/$TARGET/release/simadmin" out/simadmin
          file out/simadmin
          ls -lh out/simadmin
          # 直接覆盖包里的旧二进制，方便整包取用
          cp out/simadmin luci-app-simadmin/root/opt/simadmin/simadmin
          chmod 0755 luci-app-simadmin/root/opt/simadmin/simadmin
          tar -czf out/luci-app-simadmin.tar.gz -C luci-app-simadmin .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: simadmin-aarch64-musl
          path: out/simadmin
          if-no-files-found: error

      - name: Upload LuCI package tree
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-simadmin-pkg
          path: out/luci-app-simadmin.tar.gz
          if-no-files-found: error

      # 打 tag / 发布 release 时顺手把二进制挂上去，省得每次去翻 artifact。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/simadmin
            out/luci-app-simadmin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
