name: build-aarch64

# 目标：产出可直接放进 luci-app-simadmin/root/opt/simadmin/ 的 aarch64-musl 二进制。
# 本机（Windows）没有 aarch64-linux-musl 交叉编译器，ring / rusqlite 的 C 部分编不过，
# 所以交叉编译放在 Linux runner 上做。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-musl
  # musl 目标必须用 musl 专用 gcc；gcc-aarch64-linux-gnu（glibc）会链接失败。
  CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
  AR_aarch64_unknown_linux_musl: aarch64-linux-musl-ar
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc

jobs:
  # 先跑纯逻辑单测（SIP 报文、RPDU/TPDU 编解码、EF_SMSC 解析、去重落库…），
  # 交叉编译一旦挂在这里就能第一时间定位是代码问题还是工具链问题。
  test:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SimAdmin-main/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('SimAdmin-main/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run volte tests
        working-directory: SimAdmin-main
        run: cargo test --locked volte -- --test-threads=1

  build:
    name: Build aarch64-musl
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 musl cross toolchain
        run: |
          set -euo pipefail
          for url in \
            "https://musl.cc/aarch64-linux-musl-cross.tgz" \
            "https://more.musl.cc/11.2.1/x86_64-linux-musl/aarch64-linux-musl-cross.tgz" \
            "https://more.musl.cc/10.2.1/x86_64-linux-musl/aarch64-linux-musl-cross.tgz"; do
            echo "== downloading $url"
            if curl -fsSL --retry 3 --retry-delay 5 --max-time 600 -o /tmp/musl.tgz "$url"; then
              ok=1; break
            fi
          done
          [ "${ok:-0}" = "1" ] || { echo "所有 musl 工具链镜像都下载失败"; exit 1; }
          sudo tar -xzf /tmp/musl.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          /opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc --version | head -1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SimAdmin-main/target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('SimAdmin-main/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-musl-

      - name: Build simadmin
        working-directory: SimAdmin-main
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET" -p simadmin

      - name: Stage binary into LuCI package
        run: |
          set -euo pipefail
          mkdir -p out
          cp "SimAdmin-main/target/$TARGET/release/simadmin" out/simadmin
          file out/simadmin
          ls -lh out/simadmin
          # 直接覆盖包里的旧二进制，方便整包取用
          cp out/simadmin luci-app-simadmin/root/opt/simadmin/simadmin
          chmod 0755 luci-app-simadmin/root/opt/simadmin/simadmin
          tar -czf out/luci-app-simadmin.tar.gz -C luci-app-simadmin .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: simadmin-aarch64-musl
          path: out/simadmin
          if-no-files-found: error

      - name: Upload LuCI package tree
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-simadmin-pkg
          path: out/luci-app-simadmin.tar.gz
          if-no-files-found: error

      # 打 tag / 发布 release 时顺手把二进制挂上去，省得每次去翻 artifact。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/simadmin
            out/luci-app-simadmin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
